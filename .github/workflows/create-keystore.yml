name: Create release keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore and passwords
        run: |
          mkdir out
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore out/tsunami-release.keystore \
            -alias tsunami \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Tsunami, O=Tsunami, C=US"
          base64 -w0 out/tsunami-release.keystore > out/KEYSTORE_BASE64.txt
          {
            echo "Add these four repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "KEYSTORE_BASE64  = the contents of KEYSTORE_BASE64.txt"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = tsunami"
            echo "KEY_PASSWORD      = $PASS"
            echo
            echo "Then BACK UP tsunami-release.keystore and this file somewhere safe and offline,"
            echo "and delete the downloaded copies from your Downloads folder."
          } > out/SECRETS-README.txt

      - name: Upload (deleted automatically after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: tsunami-release-keystore
          path: out/
          retention-days: 1
